<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>무기 성장 2D 액션 게임</title>
    <!-- 외부 CSS 연동 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="game-container">
    <!-- 게임 상단 HUD -->
    <div id="hud">
        <div>STAGE: <span id="stage-val">1</span></div>
        <div>SCORE: <span id="score-val">0</span></div>
        <div>WEAPON: <span id="weapon-type-ui">-</span> (Lv.<span id="weapon-lvl">1</span>)</div>
        <div>HP: <span id="player-hp" style="color: #ff3366;"></span></div>
    </div>

    <!-- 보스 체력바 -->
    <div id="boss-hp-container" class="hidden">
        <div id="boss-hp-fill"></div>
    </div>

    <!-- 스테이지 클리어 문구 -->
    <div id="stage-clear-msg" class="hidden">STAGE CLEAR!</div>

    <!-- 게임 시작 화면 -->
    <div id="start-screen" class="screen">
        <h1>무기 선택 & 게임 시작</h1>
        <div class="weapon-select">
            <div class="weapon-card" data-weapon="sword">
                <h3>근접검</h3>
                <p>순수 근접 휘두르기 타격 및 스택 필살기</p>
            </div>
            <div class="weapon-card" data-weapon="shotgun">
                <h3>샷건</h3>
                <p>조절된 근접 멀티 펠릿 사격</p>
            </div>
            <div class="weapon-card" data-weapon="sniper">
                <h3>스나이퍼</h3>
                <p>레벨업 아이템 획득 시 차징 관통 사격</p>
            </div>
        </div>
        <button id="start-btn" disabled>게임 시작</button>
    </div>

    <!-- 게임 오버 화면 -->
    <div id="game-over-screen" class="screen hidden">
        <h1 style="color: #ff3366;">GAME OVER</h1>
        <p style="margin-bottom: 20px; font-size: 18px;">최종 점수: <span id="final-score">0</span></p>
        <button id="restart-btn">다시 시작</button>
    </div>

    <!-- 승리 화면 -->
    <div id="victory-screen" class="screen hidden">
        <h1>VICTORY!</h1>
        <p style="margin-top: 10px; font-size: 18px;">모든 스테이지를 클리어했습니다!</p>
        <p style="margin-bottom: 20px; font-size: 18px;">최종 점수: <span id="victory-score">0</span></p>
        <button id="victory-restart-btn">다시 시작</button>
    </div>

    <!-- 2D Canvas -->
    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<!-- 외부 JavaScript 연동 -->
<script src="script.js"></script>
</body>
</html>
